name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: house rules and changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Format checker
        run: python3 misc/scripts/check_format.py
      - name: Changelog is current
        run: python3 misc/scripts/build_changelog.py --check

  benchmarks:
    name: benchmark smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: misc/benchmarks/common/requirements.txt
      - name: Pinned environment
        run: python3 -m pip install -r misc/benchmarks/common/requirements.txt
      - name: Every benchmark in quick mode, ten second budget each
        run: |
          set -euo pipefail
          for dir in misc/benchmarks/[0-9][0-9]-*/; do
            start=$(date +%s%N)
            QUICK=1 timeout 30 "${dir}run.sh" > /dev/null
            elapsed=$(( ($(date +%s%N) - start) / 1000000 ))
            echo "${dir} ${elapsed} ms"
            if [ "${elapsed}" -gt 10000 ]; then
              echo "::error::${dir} quick mode took ${elapsed} ms, the budget is 10000 ms"
              exit 1
            fi
          done
      - name: Quick mode wrote nothing to committed results
        run: git diff --exit-code
